<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My TradingView – BTC & GOLD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#131722;--panel:#1e222d;--border:#2a2e39;--text:#d1d4dc;--muted:#787b86;--accent:#2962ff;--up:#26a69a;--down:#ef5350}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px -apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  #top{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
  #top .logo{font-weight:700;color:#fff;margin-right:8px}
  #main{flex:1;display:flex;min-height:0}
  #tools{width:52px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px;overflow-y:auto;overflow-x:visible;z-index:20}
  #tools button{width:40px;height:40px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:16px;position:relative;flex:none}
  #tools button:hover{background:var(--border)}
  #tools button.active{background:var(--accent);color:#fff}
  #tools .sep{width:28px;height:1px;background:var(--border);margin:4px 0}
  /* movable favorites toolbar ON the chart */
  .favbar{display:none;position:absolute;z-index:14;top:10px;left:10px;align-items:center;gap:2px;padding:4px 6px 4px 4px;background:#1e222df2;border:1px solid #434651;border-radius:10px;box-shadow:0 4px 18px #000a;backdrop-filter:blur(6px);touch-action:none}
  .favbar.on{display:flex}
  .favbar .fgrip{width:14px;height:28px;margin-right:2px;border-radius:5px;cursor:grab;display:flex;align-items:center;justify-content:center;color:#787b86;font-size:11px;letter-spacing:-1px;user-select:none;flex:none}
  .favbar .fgrip:hover{background:var(--border);color:#ff9800}
  .favbar.dragging .fgrip{cursor:grabbing}
  .favbar .flbl{font-size:10px;color:#ff9800;font-weight:700;padding:0 4px 0 0;user-select:none}
  .favbar button{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--text);cursor:pointer;font-size:15px;position:relative;flex:none}
  .favbar button:hover{background:var(--border)}
  .favbar button.active{background:var(--accent);color:#fff}
  .favbar button .x{display:none;position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ef5350;color:#fff;font-size:9px;line-height:14px;text-align:center}
  .favbar button:hover .x{display:block}
  .favbar .fadd{width:28px;height:28px;border:1px dashed #434651;border-radius:7px;background:transparent;color:#787b86;cursor:pointer;font-size:16px;line-height:1}
  .favbar .fadd:hover{border-color:#ff9800;color:#ff9800}
  /* floating name label — overflow:auto on #tools would clip ::after tooltips */
  #tooltip{display:none;position:fixed;z-index:200;background:#1a1e2a;color:#fff;border:1px solid #434651;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;pointer-events:none;box-shadow:0 4px 16px #000a;white-space:nowrap;max-width:260px}
  #tooltip b{color:#8ab4ff;font-weight:700;margin-right:6px}
  /* hide Lightweight Charts “Charting by TradingView” watermark */
  .chart a[href*="tradingview"],.cwrap a[href*="tradingview"]{display:none!important}
  #grid{flex:1;display:grid;gap:1px;background:var(--border);min-width:0}
  .panel{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;outline:none}
  .panel.focus{box-shadow:inset 0 0 0 1px var(--accent)}
  .phead{position:relative;display:flex;align-items:center;gap:6px;padding:0 8px;height:34px;flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;border-bottom:1px solid var(--border)}
  .phead::-webkit-scrollbar{display:none}
  .phead>*{flex:none}
  .phead>.legend{flex:0 1 auto}
  .torealtime{display:none;position:absolute;z-index:11;right:82px;bottom:40px;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%;border:1px solid #434651;background:#1e222dee;color:#d1d4dc;font-size:20px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 2px 10px #000a}
  .torealtime:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .toast{display:none;position:absolute;z-index:12;top:12px;left:50%;transform:translateX(-50%);background:#2962ff;color:#fff;padding:7px 16px;border-radius:22px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 18px #000a;pointer-events:none}
  .toast.ok{background:#089981}
  .toast.warn{background:#d98200}
  .spin{display:inline-block;width:11px;height:11px;margin-right:8px;vertical-align:-1px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gtpop{display:none;position:absolute;z-index:9;top:8px;left:50%;transform:translateX(-50%);align-items:center;gap:8px;white-space:nowrap;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:0 4px 16px #0009;font-size:12px}
  .gtpop input,.rsel input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;color-scheme:dark}
  .gtpop .gtgo,.rsel .rgo{background:var(--accent);color:#fff;padding:4px 14px}
  .gtpop .gtgo:hover,.rsel .rgo:hover{background:#1e4fd8;color:#fff}
  .rsel,.rbar{display:none;position:absolute;z-index:8;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 10px;box-shadow:0 4px 16px #0008;color:var(--text)}
  .rsel,.rbar{white-space:nowrap;font-size:12px}
  .rsel{top:10px;left:50%;transform:translateX(-50%)}
  .rbar{bottom:34px;left:50%;transform:translateX(-50%)}
  .rlabel{color:var(--text);font-variant-numeric:tabular-nums;font-size:12px}
  .rsel input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;color-scheme:dark}
  .rplay{font-size:15px;color:#fff!important;background:var(--accent)!important}
  .tfs button,.btn{background:transparent;border:0;color:var(--muted);padding:3px 7px;border-radius:4px;cursor:pointer;font-size:12px}
  .tfs button:hover,.btn:hover{background:var(--border);color:var(--text)}
  .tfs button.on,.btn.on{color:var(--accent);background:rgba(41,98,255,.15)}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px}
  .legend{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
  .legend b{color:var(--text)}
  .cwrap{flex:1;position:relative;min-height:0}
  .cwrap .chart{position:absolute;inset:0}
  .cwrap > canvas{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
  .cwrap > canvas.capture{pointer-events:auto;cursor:crosshair}
  .cwrap.hot, .cwrap.hot *{cursor:move !important}
  #hist{display:none;position:fixed;inset:0;z-index:100;background:#000a;align-items:center;justify-content:center}
  .hbox{width:min(720px,92vw);max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid #434651;border-radius:10px;box-shadow:0 10px 40px #000}
  .hhead{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
  #histlist{overflow-y:auto;padding:6px 10px 12px}
  .hrow{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px solid #2a2e3966;font-size:12px}
  .hrow .ht{color:var(--muted);width:150px;font-variant-numeric:tabular-nums}
  .hrow .hs{width:130px}
  .hrow .ha{width:70px;font-weight:700}
  .hrow.create .ha{color:#26a69a}.hrow.update .ha{color:#ff9800}.hrow.delete .ha{color:#ef5350}.hrow.restore .ha{color:#2962ff}
  .hrow .hy{color:var(--muted);flex:1}
  #dtool{display:none;position:fixed;z-index:60;align-items:center;gap:6px;background:var(--panel);border:1px solid #434651;border-radius:10px;padding:5px 8px;box-shadow:0 6px 22px #000b;white-space:nowrap}
  #dtool .dsep{width:1px;height:20px;background:var(--border)}
  #dsw,#dw{display:flex;gap:5px;align-items:center}
  #dsw i{width:18px;height:18px;border-radius:50%;border:2px solid #444;cursor:pointer;display:block}
  #dsw i:hover{transform:scale(1.15)}
  #dsw i.on{border-color:#fff}
  #dcolor{width:26px;height:22px;padding:0;border:1px solid var(--border);background:none;cursor:pointer;border-radius:4px}
  #dtool button{background:transparent;border:1px solid transparent;color:var(--text);border-radius:5px;cursor:pointer;padding:3px 7px;font-size:12px;height:26px}
  #dtool button:hover{background:var(--border)}
  #dtool button.on{border-color:var(--accent);background:rgba(41,98,255,.2)}
  #dw button{width:30px;display:flex;align-items:center;justify-content:center;padding:0}
  #dw button i{display:block;width:16px;background:currentColor;border-radius:2px}
  #ddel{color:#ff6b6b!important}
  #ddel:hover{background:#ef535033!important}
  #dcount{color:var(--muted);font-size:12px}
  .status{position:absolute;right:70px;bottom:28px;color:var(--muted);font-size:11px;z-index:5}
  .layouts button{padding:3px 8px}
  #layoutPick{max-width:180px;font-weight:600}
  .symwrap{position:relative;min-width:160px;max-width:240px}
  .symbtn{width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .symbtn:hover{border-color:var(--accent)}
  /* TradingView-style symbol search */
  #symsearch{display:none;position:fixed;inset:0;z-index:120;background:#000a;align-items:flex-start;justify-content:center;padding:8vh 12px 12px}
  #symsearch.on{display:flex}
  .ssbox{width:min(560px,96vw);max-height:80vh;display:flex;flex-direction:column;background:#1e222d;border:1px solid #434651;border-radius:12px;box-shadow:0 16px 60px #000d;overflow:hidden}
  .sshead{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .sshead .sslbl{color:var(--muted);font-size:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  #ssq{width:100%;font-size:18px;font-weight:600;padding:12px 14px;border-radius:8px;border:1px solid #434651;background:#131722;color:#fff;outline:none}
  #ssq:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(41,98,255,.25)}
  #ssq::placeholder{color:#5d606b;font-weight:500;font-size:16px}
  #sshint{margin-top:8px;font-size:12px;color:var(--muted);min-height:18px}
  #sshint.ok{color:#26a69a} #sshint.bad{color:#ef5350} #sshint.wait{color:#ff9800}
  #sslist{overflow-y:auto;flex:1;padding:6px 0 10px}
  .ssgrp{padding:10px 16px 4px;color:#787b86;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .ssrow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:var(--text);font:inherit}
  .ssrow:hover,.ssrow.active{background:rgba(41,98,255,.18)}
  .ssrow .ssid{font-weight:700;font-size:14px}
  .ssrow .ssid mark{background:#2962ff66;color:#fff;border-radius:2px;padding:0 1px}
  .ssrow .ssname{color:#b2b5be;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ssrow .ssname mark{background:#2962ff66;color:#fff;border-radius:2px}
  .ssrow .ssex{font-size:11px;color:#787b86;border:1px solid #363a45;border-radius:4px;padding:2px 6px;white-space:nowrap}
  .ssempty{padding:40px 20px;text-align:center;color:var(--muted)}
  .ssempty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">◢ MyTV</span>
    <span style="color:var(--muted)">Chart layout</span>
    <select id="layoutPick" title="Each layout has its own drawings"></select>
    <button class="btn" id="layoutNew" title="Create a new empty layout">＋ New</button>
    <button class="btn" id="layoutRen" title="Rename this layout">✎</button>
    <button class="btn" id="layoutDel" title="Delete this layout">🗑</button>
    <span style="color:var(--muted);margin-left:10px">Panels</span>
    <span class="layouts" id="layouts"></span>
    <span style="color:var(--muted);margin-left:10px">All panels timeframe</span>
    <span class="tfs" id="allTf"></span>
    <label style="margin-left:10px;color:var(--muted)"><input type="checkbox" id="syncCross"> Sync crosshair</label>
    <span style="margin-left:auto;color:var(--muted)">BTC spot · Gold XAUUSDT fut ≈ Capital.com · India NSE/BSE</span>
    <button class="btn" id="dbstat" style="margin-left:6px" onclick="showHistory()">◌ Connecting…</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="grid"></div>
  </div>
</div>

<div id="hist"><div class="hbox"><div class="hhead"><b>Drawing history</b><span style="color:var(--muted);font-size:12px">every create / change / delete is kept in the database</span><button class="btn" style="margin-left:auto" onclick="document.getElementById('hist').style.display='none'">✕ Close</button></div><div id="histlist"></div></div></div>
<div id="symsearch"><div class="ssbox">
  <div class="sshead">
    <div class="sslbl"><span>Symbol search</span><button class="btn" id="ssx" title="Close (Esc)">✕</button></div>
    <input id="ssq" type="text" autocomplete="off" spellcheck="false" placeholder="Type symbol or company — e.g. RELIANCE, INFY, NIFTY, BTC…">
    <div id="sshint">Start typing — matches appear instantly</div>
  </div>
  <div id="sslist"></div>
</div></div>
<div id="dtool">
  <span id="dsw"></span>
  <input type="color" id="dcolor" title="Custom colour" value="#2962ff">
  <span class="dsep"></span>
  <span id="dw"></span>
  <button id="ddash" title="Dashed / solid">┄</button>
  <span class="dsep"></span>
  <span id="dcount"></span>
  <button id="ddel" title="Delete selected (Del)">🗑 Delete</button>
</div>

<script>
/* ================= config ================= */
const CRYPTO = { BTCUSDT:'BTC / USDT (Binance)', XAUUSDT:'XAU / USD (Gold · Capital.com≈)' };
let SYMBOLS = {...CRYPTO};          // grows with India catalog + any searched ticker
let INDIA = [];                     // [{id,name,group}]
const FUT = { XAUUSDT:1 };          // Binance USD-M futures (spot XAU not listed)
const mig = s => (s==='PAXGUSDT'||s==='GOLD'||s==='XAUUSD') ? 'XAUUSDT' : s;
const isIndia = s => {
  s = mig(s||'');
  return /\.NS$|\.BO$/i.test(s) || /^\^NSE|^\^BSE|^\^CNX|^\^INDIA/i.test(s) || INDIA.some(x=>x.id===s);
};
const symLabel = s => SYMBOLS[s] || (INDIA.find(x=>x.id===s)||{}).name || s;
const TFS = { '1m':60,'5m':300,'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400,'1w':604800 };
const HOSTS = ['https://api.binance.com','https://data-api.binance.vision'];
const WS = ['wss://stream.binance.com:9443/ws/','wss://data-stream.binance.vision/ws/'];
const TZ = -new Date().getTimezoneOffset()*60;           // show local time
const LAYOUTS = {
  '1':  {cols:'1fr', rows:'1fr', n:1, label:'▢'},
  '2h': {cols:'1fr 1fr', rows:'1fr', n:2, label:'◫'},
  '2v': {cols:'1fr', rows:'1fr 1fr', n:2, label:'⬒'},
  '4':  {cols:'1fr 1fr', rows:'1fr 1fr', n:4, label:'⊞'},
};
const TOOLS = [
  ['cursor','✛','Cursor','Select and move drawings'],
  ['trend','╱','Trend line','Draw a trend line between two points'],
  ['ray','↗','Ray','Trend ray that extends forward'],
  ['hline','─','Horizontal line','Full-width price line'],
  ['vline','│','Vertical line','Full-height time line'],
  ['rect','▭','Rectangle','Price range box'],
  ['long','⬆','Long position','Risk/reward for a buy — drag entry → stop'],
  ['short','⬇','Short position','Risk/reward for a sell — drag entry → stop'],
  ['fib','☰','Fib retracement','Fibonacci levels'],
  ['brush','✎','Brush','Freehand drawing'],
  ['text','T','Text','Add a text label'],
  ['measure','⇔','Measure','Measure price change & bars'],
  ['sep'],
  ['erase','⌫','Eraser','Click a drawing to delete it'],
  ['undo','↶','Undo','Remove last drawing'],
  ['clear','🗑','Delete all','Delete every drawing on this symbol'],
];
const isRR = t => t==='long'||t==='short'||t==='rr';
const COLORS = ['#2962ff','#f23645','#089981','#ff9800','#e91e63','#ffffff'];
const FIB = [0,0.236,0.382,0.5,0.618,0.786,1];

/* ================= state ================= */
const DEFAULT_PANELS=[
  {s:'BTCUSDT',tf:'1h'},
  {s:'^NSEI',tf:'1d'},
  {s:'RELIANCE.NS',tf:'1d'},
  {s:'XAUUSDT',tf:'1h'},
];
const saved = JSON.parse(localStorage.getItem('mytv_state')||'null');
const state = saved || { layout:'2h', panels:DEFAULT_PANELS.map(p=>({...p})) };
state.panels.forEach(p=>p.s=mig(p.s));

/* Named chart layouts (TradingView-style). Drawings are per layout — not shared. */
let workspaceList = JSON.parse(localStorage.getItem('mytv_layouts')||'null') || [{id:'default',name:'Default',grid:state.layout,panels:state.panels}];
let activeLayoutId = localStorage.getItem('mytv_active_layout')||workspaceList[0].id;
let drawBag = JSON.parse(localStorage.getItem('mytv_drawbag')||'null');
if(!drawBag){
  const old = JSON.parse(localStorage.getItem('mytv_draw')||'{}');
  for(const k of ['PAXGUSDT','GOLD','XAUUSD']){
    if(old[k]){old.XAUUSDT=(old.XAUUSDT||[]).concat(old[k]);delete old[k]}
  }
  drawBag = {[activeLayoutId]:old};
}
for(const lid in drawBag){
  const bag=drawBag[lid];
  for(const k of ['PAXGUSDT','GOLD','XAUUSD']){
    if(bag[k]){bag.XAUUSDT=(bag.XAUUSDT||[]).concat(bag[k]);delete bag[k]}
  }
}
workspaceList.forEach(L=>(L.panels||[]).forEach(p=>p.s=mig(p.s)));
let drawings = drawBag[activeLayoutId]||(drawBag[activeLayoutId]={});
let tool='cursor', color=COLORS[0];
const sel=new Set();
let selPanel=null;
function deleteSel(){
  if(!sel.size)return;
  for(const s in drawings)drawings[s]=drawings[s].filter(d=>!sel.has(d));
  sel.clear();saveDraw();
}
const panels=[];
let focusPanel=null;
function curWorkspace(){return workspaceList.find(L=>L.id===activeLayoutId)||workspaceList[0]}
function cacheLocal(){
  drawBag[activeLayoutId]=drawings;
  localStorage.setItem('mytv_drawbag',JSON.stringify(drawBag));
  localStorage.setItem('mytv_layouts',JSON.stringify(workspaceList));
  localStorage.setItem('mytv_active_layout',activeLayoutId);
  localStorage.setItem('mytv_state',JSON.stringify({layout:state.layout,panels:state.panels,active:activeLayoutId}));
}
function fillLayoutPick(){
  const s=document.getElementById('layoutPick');if(!s)return;
  s.innerHTML='';
  for(const L of workspaceList){
    const o=document.createElement('option');o.value=L.id;o.textContent=L.name;s.appendChild(o);
  }
  s.value=activeLayoutId;
}
function adoptWorkspace(L, srvDraw){
  activeLayoutId=L.id;
  state.layout=L.grid||state.layout;
  state.panels=(L.panels||DEFAULT_PANELS).map(p=>({...p,s:mig(p.s)}));
  drawings=srvDraw||drawBag[L.id]||{};
  drawBag[L.id]=drawings;
  for(const k of Object.keys(lastPushed))delete lastPushed[k];
  sel.clear();
  cacheLocal();
  fillLayoutPick();
}

/* ================= database sync (server.py + SQLite) ================= */
const API = /^https?:$/.test(location.protocol) ? location.origin : 'http://127.0.0.1:8787';
let token = localStorage.getItem('mytv_token')||'';
let online=false, lastRev=null, pushTimer=null, settingsTimer=null, pushing=false, dirty=false, bootMsg=null, switching=false;
const lastPushed={};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function normDrawings(o){for(const s in o)(o[s]||[]).forEach(d=>{d.id=String(d.id||uid())})}
function setStatus(kind){
  const el=document.getElementById('dbstat');if(!el)return;
  const m={
    ok:['● Saved in database','#26a69a','Each chart layout keeps its own drawings in the database. Click for history.'],
    saving:['◌ Saving…','#ff9800','Saving to the database…'],
    connecting:['◌ Connecting…','#ff9800','Connecting to the database server…'],
    offline:['○ Offline – saved only in this browser','#ef5350','Start the server with start.bat (python server.py) and reload.'],
  }[kind];
  el.textContent=m[0];el.style.color=m[1];el.title=m[2];
}
async function api(path,opt={},retried){
  const r=await fetch(API+path,{...opt,signal:AbortSignal.timeout(8000),headers:{'Content-Type':'application/json','X-Token':token,...(opt.headers||{})}});
  if(r.status===401&&!retried){
    const t=prompt('This server needs a password (token):');
    if(t){token=t;localStorage.setItem('mytv_token',t);return api(path,opt,true)}
  }
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+(t?' '+t:''))}
  return r.json();
}
const sameDrawings=(a,b)=>{const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);for(const k of ks)if(JSON.stringify(a[k]||[])!==JSON.stringify(b[k]||[]))return false;return true};
function applyServer(srv){
  normDrawings(srv);
  if(!sameDrawings(srv,drawings)){sel.clear();drawings=srv}
  drawBag[activeLayoutId]=drawings;

async function bootSync(reconnect){

  workspaceList=b.layouts.length?b.layouts:workspaceList;
  const want=b.active||activeLayoutId;
  const L=workspaceList.find(x=>x.id===want)||workspaceList[0];
  const srvHas=Object.values(b.drawings||{}).some(a=>a.length);
  const locHas=Object.values(drawBag[L.id]||drawings||{}).some(a=>a.length);
  if(!reconnect){
    adoptWorkspace(L, b.drawings||{});
    if(!srvHas&&locHas){
      const n=Object.values(drawings).reduce((t,a)=>t+a.length,0);
      for(const s in drawings)delete lastPushed[s];
      await pushDrawings();
      bootMsg=`Moved ${n} drawing${n>1?'s':''} into layout “${L.name}”`;
    }
  }else{
    applyServer(b.drawings||{});
  }
  fillLayoutPick();
  setStatus('ok');
}
const saveDraw=()=>{

async function pushDrawings(){
  pushTimer=null;
  if(pushing){pushTimer=setTimeout(pushDrawings,300);return}
  pushing=true;
  const lid=activeLayoutId;
  try{
    for(const sym of Object.keys(drawings)){
      const json=JSON.stringify(drawings[sym]);
      if(lastPushed[sym]===json)continue;
      const r=await api('/api/drawings/'+encodeURIComponent(lid)+'/'+encodeURIComponent(sym),{method:'PUT',body:JSON.stringify({drawings:drawings[sym]})});
      lastPushed[sym]=json;lastRev=r.rev;

  }catch(e){online=false;setStatus('offline');pushTimer=setTimeout(pushDrawings,5000)}

}
function snapshotPanels(){

function rememberCurrentLayout(){

let _ssPanel=null, _ssRows=[], _ssIdx=0, _ssTimer=null, _ssSeq=0;
function exchOf(id){
  if(id.endsWith('.NS')||id.startsWith('^NSE')||id.startsWith('^CNX')||id.startsWith('^INDIA'))return 'NSE';
  if(id.endsWith('.BO')||id.startsWith('^BSE'))return 'BSE';
  if(id==='BTCUSDT')return 'BINANCE';
  if(id==='XAUUSDT'||id==='PAXGUSDT')return 'BINANCE';
  return ' · ';
}
function baseSymList(){
  return [
    ...Object.entries(CRYPTO).map(([id,name])=>({id,name,group:'Crypto & Gold'})),
    ...INDIA,
  ];
}
function hl(text,q){
  const t=String(text||''), qq=(q||'').trim();
  if(!qq)return t.replace(/</g,'&lt;');
  const esc=t.replace(/</g,'&lt;');
  const re=new RegExp('('+qq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc.replace(re,'<mark>$1</mark>');
}
function setSsHint(msg,kind){

function renderSymResults(list,q){
  const box=document.getElementById('sslist');
  box.innerHTML='';_ssRows=list;_ssIdx=0;
  if(!list.length){
    box.innerHTML=`<div class="ssempty"><b>No symbols found</b>Nothing matched “${(q||'').replace(/</g,'')}”. Try RELIANCE, INFY, TCS, NIFTY, BANKNIFTY, BTC…</div>`;
    setSsHint('0 matches — keep typing or try another name','bad');

  }

    const b=document.createElement('button');b.type='button';b.className='ssrow'+(i===0?' active':'');b.dataset.i=i;
    b.innerHTML=`<span class="ssid">${hl(row.id,q)}</span><span class="ssname">${hl(row.name||'',q)}</span><span class="ssex">${exchOf(row.id)}</span>`;
    b.onmouseenter=()=>{_ssIdx=i;box.querySelectorAll('.ssrow').forEach((x,j)=>x.classList.toggle('active',j===i))};

async function runSymSearch(q){
  const seq=++_ssSeq;
  q=(q||'').trim();
  if(!q){renderSymResults(baseSymList().slice(0,60),'');return}
  const ql=q.toLowerCase();
  const local=baseSymList().filter(x=>x.id.toLowerCase().includes(ql)||(x.name||'').toLowerCase().includes(ql));
  renderSymResults(local,q);
  setSsHint('Searching all India stocks for “'+q+'”…','wait');
  try{
    const r=await api('/api/india/search?q='+encodeURIComponent(q));
    if(seq!==_ssSeq)return;
    const extra=(r.results||[]).map(x=>({id:x.id,name:x.name,group:x.group||'India · More results'}));
    for(const x of extra)SYMBOLS[x.id]=`${x.name} (${x.id})`;
    const seen=new Set(local.map(x=>x.id));
    const merged=[...local,...extra.filter(x=>!seen.has(x.id))];
    renderSymResults(merged,q);
  }catch(e){
    if(seq!==_ssSeq)return;
    if(local.length)setSsHint(local.length+' local matches (online search unavailable)','ok');
    else setSsHint('Search failed — is the server running?','bad');
  }
}
(function initSymSearch(){

    if(e.key==='Escape'){e.preventDefault();closeSymSearch();return}
    if(e.key==='ArrowDown'){e.preventDefault();if(!_ssRows.length)return;_ssIdx=Math.min(_ssRows.length-1,_ssIdx+1);paint();rows.find(x=>+x.dataset.i===_ssIdx)?.scrollIntoView({block:'nearest'});return}
    if(e.key==='ArrowUp'){e.preventDefault();if(!_ssRows.length)return;_ssIdx=Math.max(0,_ssIdx-1);paint();rows.find(x=>+x.dataset.i===_ssIdx)?.scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'){e.preventDefault();const row=_ssRows[_ssIdx];if(row)pickSymSearch(row.id);return}
  });
})();
async function fetchKlines(sym,tf,limit=1000,endTime){
  sym=mig(sym);
  if(isIndia(sym)){
    const q=new URLSearchParams({symbol:sym,interval:tf,limit:String(limit)});
    if(endTime)q.set('endTime',String(endTime));
    const r=await api('/api/klines?'+q.toString());
    if(r.meta&&r.meta.name)SYMBOLS[sym]=`${r.meta.name} (${r.symbol||sym})`;
    return (r.candles||[]).map(k=>({time:k.time+TZ,open:+k.open,high:+k.high,low:+k.low,close:+k.close,vol:+(k.vol||0)}));
  }
  let err;
  for(const h of (FUT[sym]?['https://fapi.binance.com']:HOSTS)){
    const path=FUT[sym]?'/fapi/v1/klines':'/api/v3/klines';
    try{
      const r=await fetch(`${h}${path}?symbol=${sym}&interval=${tf}&limit=${limit}${endTime?'&endTime='+endTime:''}`);
      if(!r.ok) throw new Error(r.status);
      return (await r.json()).map(k=>({time:k[0]/1000+TZ,open:+k[1],high:+k[2],low:+k[3],close:+k[4],vol:+k[5]}));
    }catch(e){err=e}
  }
  throw err;
}
function sma(d,n){const o=[];let s=0;for(let i=0;i<d.length;i++){s+=d[i].close;if(i>=n)s-=d[i-n].close;if(i>=n-1)o.push({time:d[i].time,value:s/n})}return o}
function ema(d,n){const o=[],k=2/(n+1);let e;for(let i=0;i<d.length;i++){e=i?d[i].close*k+e*(1-k):d[i].close;if(i>=n-1)o.push({time:d[i].time,value:e})}return o}
/* TradingView "No gaps candles" (echepata) — each open = previous close so overnight gaps disappear */
function noGapBars(data,opt={}){
  const dayOnly=!!opt.nogapDayOnly, hourThresh=+(opt.nogapHourThresh||6);
  const out=[];
  for(let i=0;i<data.length;i++){
    const c=data[i];
    let o=c.open,h=c.high,l=c.low,cl=c.close;
    if(i>0){
      const hours=(c.time-data[i-1].time)/3600;
      if(!dayOnly||hours>hourThresh){
        o=data[i-1].close;
        // keep wicks readable if synthetic open sits outside the raw range
        h=Math.max(h,o,cl);l=Math.min(l,o,cl);
      }
    }
    out.push({time:c.time,open:o,high:h,low:l,close:cl,vol:c.vol});
  }
  return out;
}

      if(o===this)continue;
      o._syncing=true;

  /* ---- coordinate mapping (time/price <-> pixels, works beyond data range) ---- */
  t2l(t){
    const d=this.data,n=d.length;if(!n)return null;
    if(t>=d[n-1].time)return n-1+(t-d[n-1].time)/this.iv;
    if(t<=d[0].time)return (t-d[0].time)/this.iv;
    let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(d[m].time<=t)lo=m;else hi=m}
    return lo+(t-d[lo].time)/(d[lo+1].time-d[lo].time);
  }
  t2x(t){
    const l=this.t2l(t);if(l==null)return null;
    // logicalToCoordinate only handles whole bar indexes reliably, so interpolate between neighbours
    const ts=this.chart.timeScale(),i=Math.floor(l),a=ts.logicalToCoordinate(i);
    if(a==null)return null;
    if(l===i)return a;
    const b=ts.logicalToCoordinate(i+1);

  }
  x2t(x){
    const d=this.data,n=d.length;const l=this.chart.timeScale().coordinateToLogical(x);
    if(l==null||!n)return null;
    if(l>=n-1)return d[n-1].time+(l-(n-1))*this.iv;
    if(l<=0)return d[0].time+l*this.iv;
    const i=Math.floor(l);return d[i].time+(l-i)*(d[i+1].time-d[i].time);
  }
  p2y(p){return this.candle.priceToCoordinate(p)}
  y2p(y){return this.candle.coordinateToPrice(y)}
  pt(e){const r=this.cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;return{x,y,t:this.x2t(x),p:this.y2p(y)}}

  /* ---- interaction ---- */
  get list(){return drawings[this.s]||(drawings[this.s]=[])}
  pdown(e){
    setFocus(this);
    const q=this.pt(e);
    if(this.selecting){if(q.t!=null)this.beginReplay(q.t);return}
    if(q.t==null||q.p==null)return;
    if(tool==='erase'){this.erase(q);return}
    if(tool==='text'){const txt=prompt('Text:');if(txt)this.commit({type:'text',pts:[[q.t,q.p]],text:txt});return}
    if(tool==='hline'||tool==='vline'){this.commit({type:tool,pts:[[q.t,q.p]]});return}
    if(tool==='brush'){this.pending={type:'brush',pts:[[q.t,q.p]],color,brush:true};this.cv.setPointerCapture(e.pointerId);return}
    // Long / Short position (TradingView-style): drag entry → stop; target auto 1:2
    if(tool==='long'||tool==='short'){
      this.pending={type:tool,pts:[[q.t,q.p],[q.t,q.p],[q.t,q.p]],color:tool==='long'?'#26a69a':'#ef5350'};
      this.downAt=[e.clientX,e.clientY];this.cv.setPointerCapture(e.pointerId);return;
    }
    if(!this.pending){this.pending={type:tool,pts:[[q.t,q.p],[q.t,q.p]],color};this.downAt=[e.clientX,e.clientY];this.cv.setPointerCapture(e.pointerId)}
    else{this.pending.pts[1]=[q.t,q.p];this.commit(this.pending)}
  }
  pmove(e){
    const q=this.pt(e);this.mx=q.x;
    if(!this.pending||q.t==null||q.p==null)return;
    if(this.pending.brush){this.pending.pts.push([q.t,q.p]);return}
    if(isRR(this.pending.type)){
      const fixed=this.fixRR(this.pending.type,this.pending.pts[0][1],q.p);
      this.pending.pts[1]=[q.t,fixed.stop];
      this.pending.pts[2]=[q.t,fixed.target];
      return;
    }
    this.pending.pts[1]=[q.t,q.p];
  }
  pup(e){
    if(!this.pending)return;
    if(this.pending.brush){this.commit(this.pending);return}
    const moved=Math.hypot(e.clientX-this.downAt[0],e.clientY-this.downAt[1])>6;
    if(moved){
      const q=this.pt(e);
      if(isRR(this.pending.type)&&q.t!=null&&q.p!=null){
        const fixed=this.fixRR(this.pending.type,this.pending.pts[0][1],q.p);
        this.pending.pts[1]=[q.t,fixed.stop];
        this.pending.pts[2]=[q.t,fixed.target];
        this.commit(this.pending);return;
      }
      if(q.t!=null){this.pending.pts[1]=[q.t,q.p]}this.commit(this.pending);

  fixRR(side,entry,stopRaw){

  /* move a drawing in data-space from a pixel drag — keeps hline/text/rr smooth at chart edges */
  applyDrag(d,origPts,origPx,dx,dy,handle,kind,cur){
    const clampP=p=>{const lo=this.y2p(this.cv.clientHeight-30),hi=this.y2p(10);if(lo==null||hi==null)return p;return Math.min(Math.max(p,Math.min(lo,hi)),Math.max(lo,hi))};
    const priceAt=(oy)=>clampP(this.y2p(oy+dy)??origPts[0][1]);
    const timeAt=(ox,fallback)=>{const t=this.x2t(ox+dx);return t!=null?t:fallback};

    if(d.type==='hline'){

    }
    if(d.type==='vline'){
      d.pts[0]=[timeAt(origPx[0].x,origPts[0][0]),origPts[0][1]];return;
    }
    if(d.type==='text'){
      d.pts[0]=[timeAt(origPx[0].x,origPts[0][0]),priceAt(origPx[0].y)];return;
    }
    if(isRR(d.type)){
      if(d.type==='rr')d.type=(origPts[2][1]>=origPts[0][1])?'long':'short';
      const e=origPts[0][1],s=origPts[1][1],tg=origPts[2][1];
      const t0=origPts[0][0],t1=origPts[1][0];
      if(kind==='entry'||handle===0){
        const np=priceAt(origPx[0].y),ds=np-e;
        d.pts=[[t0,np],[t1,s+ds],[t1,tg+ds]];return;
      }
      if(kind==='stop'||handle===1){
        const ns=priceAt(origPx[1].y);
        const fixed=this.fixRR(d.type,e,ns);
        d.pts=[[t0,e],[t1,fixed.stop],[t1,tg]];return;
      }
      if(kind==='target'||handle===2){
        d.pts=[[t0,e],[t1,s],[t1,priceAt(origPx[2].y)]];return;
      }
      const nt0=timeAt(origPx[0].x,t0),nt1=timeAt(origPx[1].x,t1);
      const dp=priceAt(origPx[0].y)-e;
      d.pts=[[nt0,e+dp],[nt1,s+dp],[nt1,tg+dp]];return;
    }
    // generic: move one handle or whole shape
    if(handle>=0&&origPx[handle]){
      const i=handle;
      d.pts[i]=[timeAt(origPx[i].x,origPts[i][0]),priceAt(origPx[i].y)];

    }
    for(let i=0;i<origPts.length;i++){

  }
  commit(d){

  erase(q){

    if(best){drawings[this.s]=this.list.filter(d=>d!==best);saveDraw()}
  }

  // drawings whose bounding box touches a pixel rectangle (box-select)
  inRect(m){
    const x0=Math.min(m.x0,m.x1),x1=Math.max(m.x0,m.x1),y0=Math.min(m.y0,m.y1),y1=Math.max(m.y0,m.y1),out=[];
    for(const d of this.list){
      const s=this.segs(d);if(!s)continue;
      let a=1e9,b=-1e9,c=1e9,e=-1e9;
      for(const seg of s)for(const p of seg){a=Math.min(a,p.x);b=Math.max(b,p.x);c=Math.min(c,p.y);e=Math.max(e,p.y)}
      if(b>=x0&&a<=x1&&e>=y0&&c<=y1)out.push(d);
    }
    return out;
  }
  hit(q){

        if(isRR(d.type)&&P.length>=3){
          for(let k=0;k<3;k++)if(Math.hypot(q.x-P[k].x,q.y-P[k].y)<12)return{d,handle:k,kind:['entry','stop','target'][k]};
          const ye=P[0].y,ys=P[1].y,yt=P[2].y,x0=Math.min(P[0].x,P[1].x),x1=Math.max(P[0].x,P[1].x);
          if(q.x>=x0-4&&q.x<=x1+4&&Math.abs(q.y-ye)<pad)return{d,handle:0,kind:'entry'};
          if(q.x>=x0-4&&q.x<=x1+4&&Math.abs(q.y-ys)<pad)return{d,handle:1,kind:'stop'};
          if(q.x>=x0-4&&q.x<=x1+4&&Math.abs(q.y-yt)<pad)return{d,handle:2,kind:'target'};
        }else if(P.length>=2){
          for(let k=0;k<P.length;k++)if(Math.hypot(q.x-P[k].x,q.y-P[k].y)<12)return{d,handle:k};
        }else if(P.length===1&&(d.type==='hline'||d.type==='vline'||d.type==='text')){
          if(d.type==='hline'&&Math.abs(q.y-P[0].y)<pad)return{d,handle:0};
          if(d.type==='vline'&&Math.abs(q.x-P[0].x)<pad)return{d,handle:0};
        }
      }
      if(d.type==='hline'&&Math.abs(q.y-P[0].y)<pad)return{d,handle:-1,kind:'hline'};
      if(d.type==='vline'&&Math.abs(q.x-P[0].x)<pad)return{d,handle:-1,kind:'vline'};
      if(d.type==='text'){
        const fs=Math.round(10+(d.width||1.6)*3);
        const tw=Math.max(40,(d.text||'').length*fs*0.55);
        if(q.x>=P[0].x-6&&q.x<=P[0].x+tw+6&&q.y>=P[0].y-fs-6&&q.y<=P[0].y+10)return{d,handle:-1,kind:'text'};
      }
      if(isRR(d.type)&&P.length>=3){
        const x0=Math.min(P[0].x,P[1].x),x1=Math.max(P[0].x,P[1].x);
        const y0=Math.min(P[0].y,P[1].y,P[2].y),y1=Math.max(P[0].y,P[1].y,P[2].y);
        if(q.x>=x0&&q.x<=x1&&q.y>=y0&&q.y<=y1)return{d,handle:-1,kind:'body'};
      }
      if(d.type==='rect'||d.type==='fib'||d.type==='measure'){
        const[a,b]=P;
        const x0=Math.min(a.x,b.x)-4,x1=Math.max(a.x,b.x)+4,y0=Math.min(a.y,b.y)-4,y1=Math.max(a.y,b.y)+4;
        if(q.x>=x0&&q.x<=x1&&q.y>=y0&&q.y<=y1)return{d,handle:-1};
      }
      const s=this.segs(d);if(!s)continue;

  }

  /* ---- geometry ---- */
  px(d){
    const o=[];
    for(const [t,p] of d.pts){
      let x=this.t2x(t),y=this.p2y(p);
      // keep drawings draggable near edges even if time maps slightly off-scale
      if(x==null&&(d.type==='hline'||d.type==='text'))x=this.cv.clientWidth/2;
      if(y==null&&d.type==='vline')y=this.cv.clientHeight/2;
      if(x==null||y==null)return null;
      o.push({x,y});
    }
    return o;
  }
  segs(d){
    const P=this.px(d);if(!P)return null;const W=this.cv.clientWidth,H=this.cv.clientHeight,[a,b]=P;
    switch(d.type){
      case 'trend':return[[a,b]];
      case 'ray':{const dx=b.x-a.x,dy=b.y-a.y,k=dx||dy?4000/Math.hypot(dx,dy):0;return[[a,{x:a.x+dx*k,y:a.y+dy*k}]]}
      case 'hline':return[[{x:0,y:a.y},{x:W,y:a.y}]];
      case 'vline':return[[{x:a.x,y:0},{x:a.x,y:H}]];
      case 'rect':return[[a,{x:b.x,y:a.y}],[{x:b.x,y:a.y},b],[b,{x:a.x,y:b.y}],[{x:a.x,y:b.y},a]];
      case 'fib':return FIB.map(f=>{const y=a.y+(b.y-a.y)*f;return[{x:Math.min(a.x,b.x),y},{x:Math.max(a.x,b.x),y}]});
      case 'brush':{const s=[];for(let i=1;i<P.length;i++)s.push([P[i-1],P[i]]);return s}
      case 'text':{
        const fs=Math.round(10+(d.width||1.6)*3),tw=Math.max(40,(d.text||'').length*fs*0.55);
        return[[{x:a.x-4,y:a.y-fs-4},{x:a.x+tw+4,y:a.y-fs-4}],[{x:a.x+tw+4,y:a.y-fs-4},{x:a.x+tw+4,y:a.y+6}],[{x:a.x+tw+4,y:a.y+6},{x:a.x-4,y:a.y+6}],[{x:a.x-4,y:a.y+6},{x:a.x-4,y:a.y-fs-4}]];
      }

          [{x:x0,y:b.y},{x:x1,y:b.y}],
          [{x:x0,y:c.y},{x:x1,y:c.y}],
          [{x:x0,y:a.y},{x:x0,y:Math.min(b.y,c.y)}],
          [{x:x1,y:a.y},{x:x1,y:Math.min(b.y,c.y)}],

      }
    }
  }
  render(){
    const c=this.ctx,W=this.cv.clientWidth,H=this.cv.clientHeight;
    this.updateRT();
    c.clearRect(0,0,W,H);
    const axisW=this.chart.priceScale('right').width();
    c.save();c.beginPath();c.rect(0,0,W-axisW,H-26);c.clip();
    for(const d of this.list)this.drawOne(c,d,W);
    if(this.pending)this.drawOne(c,this.pending,W);
    if(this.measure)this.drawOne(c,this.measure,W);
    if(this.marq){
      const m=this.marq;c.fillStyle='rgba(41,98,255,.12)';c.strokeStyle='#2962ff';c.lineWidth=1;c.setLineDash([4,3]);
      c.fillRect(m.x0,m.y0,m.x1-m.x0,m.y1-m.y0);c.strokeRect(m.x0,m.y0,m.x1-m.x0,m.y1-m.y0);c.setLineDash([]);
    }
    if(this.selecting&&this.mx!=null){

      c.strokeStyle='#2962ff';c.lineWidth=1.5;c.setLineDash([5,4]);c.beginPath();c.moveTo(this.mx,0);c.lineTo(this.mx,H);c.stroke();c.setLineDash([]);
      c.fillStyle='#2962ff';c.font='12px sans-serif';c.fillText('✂ start replay here',this.mx+6,16);

        c.globalAlpha=fade;
        c.fillStyle=`rgba(255,152,0,${0.10+0.20*pulse})`;c.fillRect(x-bw/2,0,bw,H);
        c.strokeStyle='#ff9800';c.lineWidth=1.5;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();
        const txt=this.fmtT(this.goMark.t);c.font='bold 12px sans-serif';

  }
  countdown(c,W,H,axisW){
    const n=this.data.length;if(!n||this.replay)return;
    const last=this.data[n-1],y=this.p2y(last.close);
    if(y==null||y<12||y>H-50)return;
    let s=Math.max(0,Math.floor(last.time+this.iv-(Date.now()/1000+TZ)));
    const dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60,p=v=>String(v).padStart(2,'0');
    const txt=dd?`${dd}d ${p(hh)}:${p(mm)}:${p(ss)}`:hh?`${hh}:${p(mm)}:${p(ss)}`:`${p(mm)}:${p(ss)}`;

  drawOne(c,d,W){

    const line=(p,q)=>{c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke()};
    const fmt=v=>v.toLocaleString(undefined,{maximumFractionDigits:2});
    switch(d.type){

      case 'hline':line({x:0,y:a.y},{x:W,y:a.y});c.fillText(fmt(d.pts[0][1]),8,a.y-4);break;
      case 'vline':line({x:a.x,y:0},{x:a.x,y:9999});break;
      case 'rect':c.globalAlpha=.15;c.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);c.globalAlpha=1;c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);break;
      case 'fib':{

          if(i)c.fillRect(x1,a.y+(b.y-a.y)*FIB[i-1],x2-x1,(b.y-a.y)*(f-FIB[i-1]));
          c.globalAlpha=1;c.strokeStyle=c.fillStyle=d.recolor?d.color:`hsl(${i*45},70%,60%)`;c.lineWidth=Math.max(1,lw*0.7);line({x:x1,y},{x:x2,y});
          c.fillText(`${f}  (${fmt(p1+(p2-p1)*f)})`,x1+4,y-3)});
        c.setLineDash([4,4]);c.strokeStyle='#888';line(a,b);c.setLineDash([]);break}
      case 'brush':c.beginPath();P.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();break;
      case 'text':{
        const fs=Math.round(10+lw*3);c.font=`${fs}px sans-serif`;c.fillText(d.text,a.x,a.y);

        break}
      case 'measure':{
        const p1=d.pts[0][1],p2=d.pts[1][1],diff=p2-p1,pct=diff/p1*100,bars=Math.round((d.pts[1][0]-d.pts[0][0])/this.iv);
        const col=diff>=0?'#26a69a':'#ef5350';c.strokeStyle=c.fillStyle=col;
        c.globalAlpha=.15;c.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);c.globalAlpha=1;c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
        const txt=`${diff>=0?'+':''}${fmt(diff)} (${pct.toFixed(2)}%)  ${bars} bars`;
        const w=c.measureText(txt).width+12,bx=(a.x+b.x)/2-w/2,by=Math.min(a.y,b.y)-26;
        c.fillStyle=col;c.fillRect(bx,by,w,20);c.fillStyle='#fff';c.fillText(txt,bx+6,by+14);break}
      case 'rr':case 'long':case 'short':{
        // pts: [entry, stop, target]
        if(d.type==='rr')d.type=(d.pts[2][1]>=d.pts[0][1])?'long':'short';
        const pe=d.pts[0][1],ps=d.pts[1][1],pt=d.pts[2]?d.pts[2][1]:pe+(pe-ps)*2;
        const tg=P[2]||{x:b.x,y:this.p2y(pt)};
        const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),w=Math.max(8,x1-x0);
        const risk=Math.abs(pe-ps),reward=Math.abs(pt-pe),ratio=risk?reward/risk:0;
        const side=d.type==='short'?'Short':'Long';
        c.globalAlpha=.22;c.fillStyle='#ef5350';
        c.fillRect(x0,Math.min(a.y,b.y),w,Math.abs(b.y-a.y));
        c.fillStyle='#26a69a';
        c.fillRect(x0,Math.min(a.y,tg.y),w,Math.abs(tg.y-a.y));
        c.globalAlpha=1;c.lineWidth=lw;
        c.strokeStyle='#ef5350';line({x:x0,y:b.y},{x:x1,y:b.y});
        c.strokeStyle='#26a69a';line({x:x0,y:tg.y},{x:x1,y:tg.y});
        c.strokeStyle=d.color||(side==='Long'?'#26a69a':'#ef5350');c.setLineDash([5,4]);line({x:x0,y:a.y},{x:x1,y:a.y});c.setLineDash([]);
        c.strokeStyle='#888';c.globalAlpha=.7;line({x:x0,y:Math.min(a.y,b.y,tg.y)},{x:x0,y:Math.max(a.y,b.y,tg.y)});line({x:x1,y:Math.min(a.y,b.y,tg.y)},{x:x1,y:Math.max(a.y,b.y,tg.y)});c.globalAlpha=1;
        const riskPct=pe?(ps-pe)/pe*100:0,rewPct=pe?(pt-pe)/pe*100:0;
        c.font='bold 11px sans-serif';
        const label=(txt,y,col)=>{const tw=c.measureText(txt).width+10;c.fillStyle=col;c.fillRect(x1-tw-4,y-8,tw,16);c.fillStyle='#fff';c.fillText(txt,x1-tw,y+3)};
        label(`Stop ${fmt(ps)} (${riskPct.toFixed(2)}%)`,b.y,'#ef5350');
        label(`Target ${fmt(pt)} (${rewPct>=0?'+':''}${rewPct.toFixed(2)}%)`,tg.y,'#26a69a');
        label(`${side}  1:${ratio.toFixed(2)}  Entry ${fmt(pe)}`,a.y,d.color||(side==='Long'?'#26a69a':'#ef5350'));
        break}
    }
    c.restore();
    if(isSel&&sel.size===1&&d.type!=='brush'){
      c.save();c.fillStyle='#fff';c.strokeStyle=d.color||'#2962ff';c.lineWidth=2;
      const hs=isRR(d.type)?P:d.type==='hline'||d.type==='vline'||d.type==='text'?[P[0]]:P.length>=2?P:[];
      for(const p of hs){c.beginPath();c.arc(p.x,p.y,6,0,7);c.fill();c.stroke()}
      if(d.type==='hline'){const mx=this.cv.clientWidth/2;c.beginPath();c.arc(mx,P[0].y,7,0,7);c.fill();c.stroke()}
      c.restore();
    }
  }
}
function dot(c,p){c.beginPath();c.arc(p.x,p.y,3,0,7);c.fill()}
function distSeg(px,py,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;
  let t=l?((px-a.x)*dx+(py-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));
}

/* ================= UI ================= */
function setFocus(p){focusPanel=p;panels.forEach(x=>x.el.classList.toggle('focus',x===p&&panels.length>1))}
function setTool(t){
  if(t==='undo'){const p=focusPanel||panels[0];p.list.pop();saveDraw();return}
  if(t==='clear'){
    const p=focusPanel||panels[0],n=p.list.length;
    if(!n){p.toast('No drawings to delete on '+SYMBOLS[p.s],{warn:true,ms:2500});return}
    if(confirm(`Delete ALL ${n} drawing${n>1?'s':''} on ${SYMBOLS[p.s]}?\n(This affects every panel showing this symbol.)`)){
      drawings[p.s]=[];sel.clear();saveDraw();
      p.toast(`🗑 Deleted ${n} drawing${n>1?'s':''}`,{ok:true,ms:2500});
    }
    return;
  }
  tool=t;
  document.querySelectorAll('#tools [data-t], .favbar [data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  panels.forEach(p=>{p.updateCapture();p.pending=null});
}
/* Chart favorites toolbar — tools on/off on the chart; freely movable */
let favTools=JSON.parse(localStorage.getItem('mytv_favs')||'null')||['trend','hline','long','short','measure'];
let favPos=JSON.parse(localStorage.getItem('mytv_favpos')||'null')||{top:10,left:10};
const saveFavs=()=>localStorage.setItem('mytv_favs',JSON.stringify(favTools));
const saveFavPos=()=>localStorage.setItem('mytv_favpos',JSON.stringify(favPos));
function toggleFav(id){
  if(id==='cursor'||id==='sep'||id==='undo'||id==='clear'||id==='erase')return;
  const i=favTools.indexOf(id);
  if(i>=0)favTools.splice(i,1);else favTools.push(id);
  saveFavs();
  const keep=tool;buildFavBars();setTool(keep);
}
function toolTipEls(){
  let tip=document.getElementById('tooltip');
  if(!tip){tip=document.createElement('div');tip.id='tooltip';document.body.appendChild(tip)}
  return {
    tip,
    show(el,title,desc){
      tip.innerHTML=`<b>${title}</b>${desc||''}`;
      tip.style.display='block';
      const r=el.getBoundingClientRect();
      tip.style.left=(r.right+10)+'px';
      tip.style.top=Math.max(8,r.top+r.height/2-tip.offsetHeight/2)+'px';
    },
    hide(){tip.style.display='none'}
  };
}
function applyFavPos(bar,wrap){
  const maxL=Math.max(4,(wrap.clientWidth||400)-bar.offsetWidth-4);
  const maxT=Math.max(4,(wrap.clientHeight||300)-bar.offsetHeight-4);
  const left=Math.min(Math.max(4,favPos.left||10),maxL);
  const top=Math.min(Math.max(4,favPos.top||10),maxT);
  bar.style.left=left+'px';bar.style.top=top+'px';
}
function bindFavDrag(bar,wrap){
  const grip=bar.querySelector('.fgrip');if(!grip||bar._dragBound)return;
  bar._dragBound=true;
  grip.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    e.preventDefault();e.stopPropagation();
    bar.classList.add('dragging');
    const r=bar.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
    const ox=e.clientX-r.left,oy=e.clientY-r.top;
    const mv=ev=>{
      const left=ev.clientX-wr.left-ox, top=ev.clientY-wr.top-oy;
      const maxL=Math.max(4,wrap.clientWidth-bar.offsetWidth-4);
      const maxT=Math.max(4,wrap.clientHeight-bar.offsetHeight-4);
      favPos={left:Math.min(Math.max(4,left),maxL),top:Math.min(Math.max(4,top),maxT)};
      bar.style.left=favPos.left+'px';bar.style.top=favPos.top+'px';
    };
    const up=()=>{
      bar.classList.remove('dragging');
      removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      saveFavPos();
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
}
function buildFavBars(){
  const byId=Object.fromEntries(TOOLS.filter(t=>t[0]!=='sep').map(t=>[t[0],t]));
  const favs=favTools.map(id=>byId[id]).filter(Boolean);
  const {show,hide}=toolTipEls();
  panels.forEach(p=>{
    const bar=p.q('.favbar'),wrap=p.q('.cwrap');if(!bar||!wrap)return;
    bar.innerHTML='';bar._dragBound=false;
    bar.classList.add('on'); // always show so user can add tools / move empty bar
    const grip=document.createElement('div');grip.className='fgrip';grip.title='Drag to move toolbar';grip.textContent='⋮⋮';bar.appendChild(grip);
    const lbl=document.createElement('span');lbl.className='flbl';lbl.textContent='★';bar.appendChild(lbl);
    favs.forEach(t=>{
      const b=document.createElement('button');b.dataset.t=t[0];b.setAttribute('aria-label',t[2]);
      b.textContent=t[1];
      if(t[0]===tool)b.classList.add('active');
      const x=document.createElement('span');x.className='x';x.textContent='×';x.title='Remove from toolbar';
      x.onmousedown=e=>{e.preventDefault();e.stopPropagation()};
      x.onclick=e=>{e.preventDefault();e.stopPropagation();hide();toggleFav(t[0])};
      b.appendChild(x);
      b.onmouseenter=()=>show(b,t[2],'Click to use · × to remove');
      b.onmouseleave=hide;
      b.onclick=()=>{hide();setTool(t[0]);setFocus(p)};
      bar.appendChild(b);
    });
    const add=document.createElement('button');add.className='fadd';add.textContent='＋';add.title='Add tool to chart toolbar';
    add.onclick=e=>{
      e.stopPropagation();hide();
      const choices=TOOLS.filter(t=>t[0]!=='sep'&&t[0]!=='cursor'&&t[0]!=='undo'&&t[0]!=='clear'&&t[0]!=='erase'&&!favTools.includes(t[0]));
      if(!choices.length){p.toast('All tools already on the chart bar',{warn:true,ms:2200});return}
      const names=choices.map((t,i)=>`${i+1}. ${t[2]}`).join('\n');
      const pick=prompt('Add tool to chart toolbar:\n'+names+'\n\nType number or name:','');
      if(!pick)return;
      const n=+pick;let t=choices[n-1];
      if(!t)t=choices.find(x=>x[2].toLowerCase().includes(pick.toLowerCase())||x[0]===pick.toLowerCase());
      if(t)toggleFav(t[0]);
    };
    add.onmouseenter=()=>show(add,'Add tool','Put a drawing tool on this chart bar');
    add.onmouseleave=hide;
    bar.appendChild(add);
    applyFavPos(bar,wrap);
    bindFavDrag(bar,wrap);
    bar.onpointerdown=e=>{if(e.target.closest('.fgrip'))return;e.stopPropagation()};
  });
}
function buildTools(){
  const box=document.getElementById('tools');box.innerHTML='';
  const {show,hide}=toolTipEls();
  for(const t of TOOLS){
    if(t[0]==='sep'){box.insertAdjacentHTML('beforeend','<div class="sep"></div>');continue}
    const id=t[0],b=document.createElement('button');
    b.dataset.t=id;b.setAttribute('aria-label',t[2]);b.textContent=t[1];
    b.onmouseenter=()=>show(b,t[2],(t[3]||'')+(id!=='cursor'&&id!=='undo'&&id!=='clear'&&id!=='erase'?' · right‑click → chart toolbar':''));
    b.onmouseleave=hide;
    b.oncontextmenu=e=>{
      e.preventDefault();
      if(id==='cursor'||id==='undo'||id==='clear'||id==='erase')return;
      hide();toggleFav(id);
      const p=focusPanel||panels[0];
      p?.toast(favTools.includes(id)?('★ '+t[2]+' on chart toolbar'):(t[2]+' removed from chart'),{ok:true,ms:2000});
    };
    b.onclick=()=>{hide();setTool(id)};
    box.appendChild(b);
  }
  box.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  COLORS.forEach(c=>{const b=document.createElement('button');b.setAttribute('aria-label','Color '+c);
    b.innerHTML=`<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${c};border:2px solid #444"></span>`;
    b.onmouseenter=()=>show(b,'Color',c);
    b.onmouseleave=hide;
    b.onclick=()=>{color=c};box.appendChild(b)});
  if(tool)document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===tool));
  buildFavBars();
}
/* ---- floating style toolbar for selected drawing(s) ---- */
const dtool=document.getElementById('dtool');
const WIDTHS=[1,2,3,5];
function applySel(props){sel.forEach(d=>Object.assign(d,props));saveDraw()}
(function buildDtool(){
  const sw=document.getElementById('dsw'),dw=document.getElementById('dw');
  COLORS.forEach(c=>{const i=document.createElement('i');i.style.background=c;i.dataset.c=c;i.title=c;
    i.onclick=()=>applySel({color:c,recolor:true});sw.appendChild(i)});
  document.getElementById('dcolor').oninput=e=>applySel({color:e.target.value,recolor:true});
  WIDTHS.forEach(w=>{const b=document.createElement('button');b.dataset.w=w;b.title='Thickness '+w;
    b.innerHTML=`<i style="height:${w}px"></i>`;b.onclick=()=>applySel({width:w});dw.appendChild(b)});
  document.getElementById('ddash').onclick=()=>{const anyDash=[...sel].some(d=>d.dash);applySel({dash:!anyDash})};
  document.getElementById('ddel').onclick=()=>deleteSel();
  dtool.addEventListener('pointerdown',e=>e.stopPropagation());
})();
function updateDtool(){
  const p=selPanel;
  if(!sel.size||!p||!panels.includes(p)){dtool.style.display='none';return}
  for(const d of [...sel])if(!p.list.includes(d))sel.delete(d);          // drop drawings deleted elsewhere (undo, eraser)
  if(!sel.size||(p.drag&&p.drag.moved)||p.marq){dtool.style.display=sel.size&&!p.marq?'none':'none';return}
  let a=1e9,b=-1e9,c=1e9,e=-1e9;
  for(const d of sel){const s=p.segs(d);if(!s)continue;for(const seg of s)for(const q of seg){a=Math.min(a,q.x);b=Math.max(b,q.x);c=Math.min(c,q.y);e=Math.max(e,q.y)}}
  if(a>1e8){dtool.style.display='none';return}
  const r=p.q('.cwrap').getBoundingClientRect();
  dtool.style.display='flex';
  const w=dtool.offsetWidth,h=dtool.offsetHeight;
  let x=r.left+(Math.max(a,0)+Math.min(b,r.width))/2-w/2;
  let y=r.top+Math.max(c,0)-h-12;
  x=Math.max(Math.min(x,r.right-w-70),r.left+4);     // left edge wins if the toolbar is wider than the panel
  y=Math.max(Math.min(y,r.bottom-h-40),r.top+4);
  dtool.style.left=x+'px';dtool.style.top=y+'px';
  // reflect current style
  const ds=[...sel],one=ds[0];
  dtool.querySelectorAll('#dsw i').forEach(i=>i.classList.toggle('on',ds.every(d=>d.color===i.dataset.c)));
  dtool.querySelectorAll('#dw button').forEach(bn=>bn.classList.toggle('on',ds.every(d=>(d.width||1.6)===+bn.dataset.w)));
  document.getElementById('ddash').classList.toggle('on',ds.every(d=>d.dash));
  const cp=document.getElementById('dcolor');if(/^#[0-9a-f]{6}$/i.test(one.color||'')&&document.activeElement!==cp)cp.value=one.color;
  document.getElementById('dcount').textContent=ds.length>1?ds.length+' selected':'';
}
function buildLayout(fromSaved){
  sel.clear();
  // fromSaved=true when switching layouts: restore that layout's last symbols / timeframes
  // otherwise (changing panel grid) keep the live panel settings
  const cfgs=fromSaved
    ?(state.panels||DEFAULT_PANELS).map(p=>({s:mig(p.s),tf:p.tf||'1h',ind:p.ind||{sma:false,ema:false,vol:true}}))
    :(panels.length?panels.map(p=>({s:p.s,tf:p.tf,ind:p.ind})):state.panels);
  const L=LAYOUTS[state.layout]||LAYOUTS['2h'],g=document.getElementById('grid');
  panels.forEach(p=>{p.closeWs();p.gen++;p.chart.remove()});panels.length=0;g.innerHTML='';
  g.style.gridTemplateColumns=L.cols;g.style.gridTemplateRows=L.rows;
  for(let i=0;i<L.n;i++){const p=new Panel(i,cfgs[i]||cfgs[0]||DEFAULT_PANELS[0]);panels.push(p);g.appendChild(p.el)}
  state.panels=cfgs;
  document.querySelectorAll('#layouts button').forEach(b=>b.classList.toggle('on',b.dataset.grid===state.layout));
  setFocus(panels[0]);setTool(tool);buildFavBars();save();
}
function buildTop(){
  const l=document.getElementById('layouts');l.innerHTML='';
  for(const k in LAYOUTS){const b=document.createElement('button');b.dataset.grid=k;b.className='btn'+(k===state.layout?' on':'');b.textContent=LAYOUTS[k].label;b.style.fontSize='16px';
    b.onclick=()=>{state.layout=k;l.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.grid===k));buildLayout()};l.appendChild(b)}
  const a=document.getElementById('allTf');a.innerHTML='';
  Object.keys(TFS).forEach(t=>{const b=document.createElement('button');b.textContent=t;
    b.onclick=()=>{panels.forEach(p=>{p.tf=t;p.load()});save()};a.appendChild(b)});
  fillLayoutPick();
  document.getElementById('layoutPick').onchange=e=>switchLayout(e.target.value);
  document.getElementById('layoutNew').onclick=()=>createLayout();
  document.getElementById('layoutRen').onclick=()=>renameLayout();
  document.getElementById('layoutDel').onclick=()=>deleteLayout();
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='Escape'){setTool('cursor');sel.clear();panels.forEach(p=>p.cancelSelect())}
  if(e.ctrlKey&&(e.key==='a'||e.key==='A')){
    e.preventDefault();const p=focusPanel||panels[0];sel.clear();p.list.forEach(d=>sel.add(d));selPanel=p;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&sel.size){
    e.preventDefault();deleteSel();
  }
  if(e.ctrlKey&&e.key==='z')setTool('undo');
  const m={t:'trend',h:'hline',v:'vline',r:'rect',f:'fib',b:'brush',m:'measure',l:'long',s:'short'}[e.key];
  if(m&&!e.ctrlKey)setTool(m);
});
setInterval(()=>panels.forEach(p=>p.rollover()),500);
setInterval(()=>panels.forEach(p=>p.watchdog()),5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)panels.forEach(p=>{p.rollover();p.syncRecent()})});
(function loop(){panels.forEach(p=>p.render());updateDtool();requestAnimationFrame(loop)})();
(async function boot(){
  normDrawings(drawings);
  setStatus('connecting');
  try{await bootSync(false)}catch(e){online=false;setStatus('offline')}
  await loadIndiaCatalog();
  state.panels.forEach(p=>p.s=mig(p.s));
  buildTools();buildTop();buildLayout();
  if(bootMsg)panels[0].toast('🗄 '+bootMsg,{ok:true,ms:6000});
  else if(INDIA.length)panels[0]?.toast('🇮🇳 '+INDIA.length+' India symbols ready — search any NSE stock',{ok:true,ms:4500});
})();
