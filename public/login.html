<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in · ChartVista</title>
  <meta name="theme-color" content="#070914" />
  <meta name="application-name" content="ChartVista" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ChartVista" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#070b14; --panel:#0f1626; --border:#1f2a44; --text:#e6ecff; --muted:#8a96b8; --accent:#19e3c1; --down:#ff4d7d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(ellipse at 20% 0%, #10224a 0%, var(--bg) 55%);
      color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    form {
      width: 100%; max-width: 360px; padding: 28px; border-radius: 16px;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(25, 227, 193, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 15px;
      background: #0a1020; border: 1px solid var(--border); color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; height: 44px; margin-top: 20px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #04110e; font: inherit; font-size: 15px; font-weight: 800;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #err { min-height: 18px; margin-top: 12px; color: var(--down); font-size: 13px; }
  </style>
</head>
<body>
  <form id="f" autocomplete="on">
    <h1>ChartVista</h1>
    <p>Sign in to open your charts.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />
    <button id="b" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), b = document.getElementById('b');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = ''; b.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: f.username.value, password: f.password.value }),
        });
        if (r.ok) { location.replace('/'); return; }
        err.textContent = (await r.json().catch(() => ({}))).error || 'Sign in failed';
      } catch (x) { err.textContent = 'Network error — try again'; }
      b.disabled = false;
    });
  </script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });</script>
</body>
</html>
